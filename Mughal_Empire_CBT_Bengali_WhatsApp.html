}

 document.getElementById('result').innerHTML=`<div class="score">${correct} / ${qs.length}</div><p>শতাংশ: <b>${correct}%</b></p><p>Attempted: ${attempted} • Correct: ${correct} • Wrong: ${wrong} • Unattempted: ${unattempted}</p><hr><b>উত্তর যাচাই</b><div id="reviewAnswers"></div>`;
 const r=document.getElementById('reviewAnswers');
 qs.forEach((q,i)=>{
   const d=document.createElement('div');
   d.style.cssText='margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:10px;line-height:1.65';
   const e=explanations[i];
   const labels=['ক','খ','গ','ঘ'];
   let opts='';
   q.o.forEach((opt,j)=>{
     let text;
     if(j===q.a) text='<b>সঠিক উত্তর।</b> '+e[0];
     else {
       const wrongIndex=[0,1,2,3].filter(x=>x!==q.a).indexOf(j)+1;
       text=e[wrongIndex];
     }
     opts += `<p><b>Option ${labels[j]}. ${opt}</b><br>${text}</p>`;
   });
   d.innerHTML=`<h3 style="margin-top:0">${i+1}. ${q.q}</h3>
   <p>আপনার উত্তর: <b>${answers[i]===null?'দেওয়া হয়নি':labels[answers[i]]+'. '+q.o[answers[i]]}</b><br>
   সঠিক উত্তর: <b>${labels[q.a]}. ${q.o[q.a]}</b></p>
   <p><b>📖 বিস্তারিত ব্যাখ্যা:</b> ${e[0]}</p>
   <hr>${opts}`;
   r.appendChild(d);
 });
 window.scrollTo(0,document.body.scrollHeight);
}
const timerInt=setInterval(()=>{seconds--;let m=Math.floor(seconds/60),s=seconds%60;document.getElementById('timer').textContent=`সময়: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(seconds<=0)submitTest()},1000);
render();
</script>
